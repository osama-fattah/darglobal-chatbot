name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-cov ruff
      - name: Lint
        run: ruff check .
      - name: Tests (offline, no API key needed)
        run: pytest -q --cov=app --cov-report=term-missing
