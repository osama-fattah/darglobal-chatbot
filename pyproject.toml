[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# E741: `l` for a line in short comprehensions; B904: the chat endpoint deliberately hides internal errors
ignore = ["E741", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
